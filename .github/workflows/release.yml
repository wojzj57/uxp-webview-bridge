name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      repair_version:
        description: Existing npm version whose missing tag or GitHub Release should be repaired
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Generate release app token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          token: ${{ steps.release-app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify a manual run
        if: github.event_name == 'workflow_dispatch'
        run: pnpm lint && pnpm test && pnpm build

      - name: Configure release commit identity
        run: |
          git config user.name "wojzj57"
          git config user.email "wojzj57@gmail.com"

      - name: Create release pull request or publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: |-
            chore: release

            Signed-off-by: wojzj57 <wojzj57@gmail.com>
          createGithubReleases: false
          publish: pnpm release
          setupGitUser: false
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          NPM_TOKEN: ""

      - name: Enable auto-merge for release pull request
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          base_branch="$(gh pr view "$PR_NUMBER" --json baseRefName --jq '.baseRefName')"
          head_branch="$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')"

          if [[ "$base_branch" != "main" || "$head_branch" != "changeset-release/main" ]]; then
            echo "Refusing to enable auto-merge for $head_branch -> $base_branch" >&2
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      - name: Resolve release version
        id: release-version
        if: >-
          steps.changesets.outputs.published == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.repair_version != '')
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          REPAIR_VERSION: ${{ inputs.repair_version }}
        run: |
          if [[ -n "$REPAIR_VERSION" ]]; then
            version="$REPAIR_VERSION"
            current_version="$(node --print "require('./package.json').version")"
            if [[ "$version" != "$current_version" ]]; then
              echo "repair_version must match package.json ($current_version)." >&2
              exit 1
            fi
            package_name="$(node --print "require('./package.json').name")"
            npm view "$package_name@$version" version >/dev/null
          else
            version="$(node --input-type=module --eval "const releases = JSON.parse(process.env.PUBLISHED_PACKAGES); if (releases.length !== 1) throw new Error('Expected exactly one published package.'); process.stdout.write(releases[0].version);")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare GitHub Release notes
        if: steps.release-version.outputs.version != ''
        run: node scripts/extract-release-notes.mjs "${{ steps.release-version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Create version tag
        if: steps.release-version.outputs.version != ''
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          remote_target="$(git ls-remote --tags origin "refs/tags/$VERSION" | cut -f1)"
          if [[ -n "$remote_target" && "$remote_target" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag $VERSION already points to a different commit." >&2
            exit 1
          fi
          if [[ -z "$remote_target" ]]; then
            git tag "$VERSION"
            git push origin "refs/tags/$VERSION"
          fi

      - name: Create GitHub Release
        if: steps.release-version.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
